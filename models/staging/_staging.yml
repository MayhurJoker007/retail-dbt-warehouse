version: 2

models:
  - name: stg_orders
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['delivered', 'cancelled', 'returned', 'open']
      - name: outlet_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_outlets')
                field: outlet_id

  - name: stg_order_lines
    data_tests:
      - unique_combination:
          arguments:
            columns: ['order_id', 'product_id']
    columns:
      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: quantity
        data_tests: [not_null]

  - name: stg_products
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: sku
        data_tests: [unique]

  - name: stg_outlets
    columns:
      - name: outlet_id
        data_tests: [unique, not_null]
      - name: venue_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['Spaza', 'Tavern', 'Liquor store', 'Supermarket', 'Other']
