version: 2

models:
  - name: fct_sales
    description: Order lines, excluding cancelled orders. Returns have a negative net amount.
    data_tests:
      - unique_combination:
          arguments:
            columns: ['order_id', 'product_id']
    columns:
      - name: gross_amount
        data_tests:
          - not_null
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_id
      - name: date_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

  - name: dim_outlet
    columns:
      - name: outlet_id
        data_tests: [unique, not_null]
      - name: activity_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['Active', 'Lapsing', 'Lost', 'Never ordered']

  - name: dim_product
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: current_price
        data_tests: [not_null]

  - name: dim_date
    columns:
      - name: date_key
        data_tests: [unique, not_null]

  - name: mart_distributor_monthly
    data_tests:
      - unique_combination:
          arguments:
            columns: ['distributor_name', 'month_start']
    columns:
      - name: net_revenue
        data_tests:
          - sums_match:
              arguments:
                compare_model: ref('fct_sales')
                compare_column: net_amount
