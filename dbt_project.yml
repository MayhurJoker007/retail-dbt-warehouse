name: retail_warehouse
version: '1.0.0'
config-version: 2
profile: retail_warehouse

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
analysis-paths: ["analyses"]

models:
  retail_warehouse:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
    marts:
      +materialized: table
      +schema: marts

seeds:
  retail_warehouse:
    +schema: raw
    raw_orders:
      +column_types:
        placed_at: varchar
